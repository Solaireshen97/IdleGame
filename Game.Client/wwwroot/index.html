<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IdleGame</title>
    <base href="/" />
    <meta name="theme-color" content="#0b1723" />
    <meta name="color-scheme" content="dark" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css?v=9" />
    <link rel="stylesheet" href="css/battle.css?v=3" />
    <link rel="stylesheet" href="css/activity.css?v=1" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Game.Client.styles.css?v=49" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <main class="boot-screen" role="status" aria-live="polite">
            <div class="boot-brand">
                <span class="boot-brand__mark" aria-hidden="true">⚔</span>
                <span><strong>IdleGame</strong><small>IDLE ADVENTURE</small></span>
            </div>
            <section class="boot-card">
                <span class="boot-card__eyebrow">PREPARING ADVENTURE</span>
                <h1>正在准备冒险</h1>
                <p>读取角色、背包与战斗记录…</p>
                <div class="boot-progress">
                    <svg class="loading-progress" aria-hidden="true">
                        <circle r="40%" cx="50%" cy="50%" />
                        <circle r="40%" cx="50%" cy="50%" />
                    </svg>
                    <div class="loading-progress-text"></div>
                </div>
            </section>
            <small class="boot-screen__hint">轻量冒险 · 离线成长 · 随时回来</small>
        </main>
    </div>

    <div id="blazor-error-ui" role="alert">
        <span class="blazor-error-ui__icon" aria-hidden="true">!</span>
        <span class="blazor-error-ui__copy"><strong>冒险连接中断</strong><small>页面运行遇到问题，请重新载入后继续。</small></span>
        <a href="" class="reload">重新载入</a>
        <button type="button" class="dismiss" aria-label="关闭错误提示">×</button>
    </div>
    <script src="js/horizontal-scroll.js?v=4"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
